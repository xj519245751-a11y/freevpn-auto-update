name: Build Clash subscription

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"

permissions:
  contents: write

concurrency:
  group: build-clash-subscription
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install YAML serializer
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Install Mihomo core for live proxy checks
        run: |
          python - <<'PY'
          import gzip, json, urllib.request
          api = "https://api.github.com/repos/MetaCubeX/mihomo/releases/latest"
          req = urllib.request.Request(api, headers={"User-Agent": "freevpn-auto-update"})
          with urllib.request.urlopen(req, timeout=30) as r:
              release = json.load(r)
          asset = next(a for a in release["assets"] if a["name"].startswith("mihomo-linux-amd64-compatible-") and a["name"].endswith(".gz"))
          req = urllib.request.Request(asset["browser_download_url"], headers={"User-Agent": "freevpn-auto-update"})
          with urllib.request.urlopen(req, timeout=90) as r:
              compressed = r.read()
          with gzip.decompress(compressed) as_unused if False else open("/tmp/mihomo.gz", "wb") as f:
              f.write(compressed)
          with gzip.open("/tmp/mihomo.gz", "rb") as src, open("/usr/local/bin/mihomo", "wb") as dst:
              dst.write(src.read())
          PY
          chmod +x /usr/local/bin/mihomo
          mihomo -v
      - name: Build and live-test bounded profile
        env:
          MAX_NODES: "250"
          MAX_PUBLISH: "100"
          TEST_WORKERS: "16"
        run: python .github/scripts/build_profile.py
      - name: Validate generated YAML and report
        run: |
          python - <<'PY'
          import yaml, json
          from pathlib import Path
          p=yaml.safe_load(Path("dist/clash.yaml").read_text())
          assert isinstance(p, dict) and p.get("proxies"), "empty or invalid Clash profile"
          assert len(p["proxies"]) <= 100, "published node cap exceeded"
          assert all(x.get("name") and x.get("type") and x.get("server") and x.get("port") for x in p["proxies"]), "proxy missing required fields"
          s=json.loads(Path("dist/status.json").read_text())
          assert s["publishedNodes"] == len(p["proxies"])
          print("YAML valid; nodes:", len(p["proxies"]))
          PY
      - name: Publish generated profile
        run: |
          mkdir -p public
          cp dist/clash.yaml public/clash.yaml
          cp dist/status.json public/status.json
          touch public/.nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/
          if git diff --cached --quiet; then
            echo "No published changes"
          else
            git commit -m "chore: refresh Clash profile"
            git push
          fi
